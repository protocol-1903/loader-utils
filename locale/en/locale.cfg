[loader-utils-ui]
frame=Loader Settings
checkbox-lf=Lane-specific filters
checkbox-rl=Respect machine limits
checkbox-fs=Full stacks only

[mod-setting-name]
lu-lf-default=Loaders are lane filtered by default
lu-rl-default=Loaders respect machine limits by default
lu-fs-default=Loaders make full stacks by default
lu-show-all-loaders=Show all loaders in selection UIs
lu-enable-snapping=Enable loader target snapping

[mod-setting-description]
lu-show-all-loaders=Shows all loader entities in selection UIs like deconstruction and upgrade planners. This also allows you to use a generic upgrade planners on loaders.
lu-enable-snapping=Automatically snaps belt direction to valid targets